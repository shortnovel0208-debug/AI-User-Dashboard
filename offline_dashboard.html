<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>

  <title>AI 心智监测看板 · Offline</title>
  <style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #0f1222; color: #e8ebff; min-height: 100vh;
}
header { padding: 24px 32px 8px; }
h1 { margin: 0; font-size: 22px; }
.tag {
  background: #2a2f55; color: #aab; font-size: 12px; padding: 2px 8px;
  border-radius: 10px; margin-left: 8px; vertical-align: middle;
}
.sub { color: #9aa3d1; margin: 4px 0 0; font-size: 14px; }
.tabs {
  display: flex; gap: 4px; padding: 12px 32px 0; border-bottom: 1px solid #1d2145;
}
.tab {
  background: transparent; color: #b4bbe4; border: 0; padding: 10px 18px;
  cursor: pointer; font-size: 14px; border-radius: 8px 8px 0 0;
}
.tab.active { background: #1a1e3e; color: #fff; }
.tab .badge {
  background: #ff6b6b; color: #fff; font-size: 11px; padding: 1px 6px;
  border-radius: 9px; margin-left: 4px;
}
.panel { padding: 20px 32px; }
.panel.hidden { display: none; }
.controls {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
}
.controls label { font-size: 13px; color: #aab; display: flex; gap: 6px; align-items: center; }
select {
  background: #1a1e3e; color: #e8ebff; border: 1px solid #2a2f55;
  padding: 6px 10px; border-radius: 6px; font-size: 13px;
}
.chart-wrap { background: #151937; border-radius: 10px; padding: 14px; height: 360px; position: relative; }
.chart-wrap canvas { width: 100%; height: 100%; display: block; }
.hint { color: #7a83b4; font-size: 12px; margin-top: 8px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two-col h3 { margin: 0 0 8px; font-size: 14px; color: #b4bbe4; }
.quotes { display: grid; gap: 12px; }
.quote {
  background: #151937; border-left: 3px solid #5c7cff; padding: 12px 14px;
  border-radius: 6px;
}
.quote .meta { font-size: 12px; color: #7a83b4; margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
.quote .meta .pill {
  background: #2a2f55; color: #b4bbe4; padding: 1px 8px; border-radius: 8px;
}
.quote .pill.cn { background: #3a2550; color: #ffbce3; }
.quote .pill.en { background: #1e3b55; color: #9ad4ff; }
.quote .pill.hn { background: #3a3a25; color: #ffe7ad; }
.quote .pill.x-en { background: #1e2f55; color: #b7ccff; }
.quote .pill.x-cn { background: #3a2550; color: #ffbce3; }
.quote p { margin: 4px 0; }
.quote .t { color: #9aa3d1; font-size: 13px; font-style: italic; }
.review { display: grid; gap: 14px; }
.rcard {
  background: #151937; border-radius: 8px; padding: 14px;
  border: 1px solid #2a2f55;
}
.rcard.verified { border-color: #3d6b3d; opacity: 0.75; }
.rcard .orig { margin: 6px 0 10px; }
.rcard .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 8px; }
.rcard .fields label { display: block; font-size: 11px; color: #7a83b4; margin-bottom: 3px; }
.rcard .row-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rcard textarea {
  background: #0f1222; border: 1px solid #2a2f55; color: #e8ebff;
  border-radius: 6px; width: 100%; padding: 6px 8px; font-size: 12px; resize: vertical;
}
.rcard button {
  background: #5c7cff; color: #fff; border: 0; padding: 6px 14px;
  border-radius: 6px; cursor: pointer; font-size: 13px;
}
.rcard button.secondary { background: #2a2f55; }
.rcard .changed { color: #ffbc5c; font-size: 11px; }
.stats { color: #9aa3d1; font-size: 13px; margin-left: auto; }
footer { padding: 20px 32px 30px; color: #5c6696; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>AI 心智监测看板 <span class="tag">Offline</span></h1>
    <p class="sub">离线静态版：内置 Hacker News 公开数据（约 100 条）+ 你提供的 X 真实用户观点样本，可直接双击打开，不依赖后端服务。</p>

  <nav class="tabs">

  <section id="tab-trends" class="panel">
    <div class="controls">
      <label>议题

      <label>平台
        <select id="trend-region">
          <option value="">全部</option>

          <option value="X-EN">X / 英文</option>
          <option value="X-CN">X / 中文</option>
        </select>
      </label>
      <label>用户分层
        <select id="trend-author">
          <option value="">全部</option>
          <option value="kol">意见领袖</option>
          <option value="tech">科技从业者</option>
          <option value="parent">家长</option>
          <option value="general">普通用户</option>
        </select>

    </div>
    <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
    <p class="hint">每条曲线 = 一种立场的月度讨论量。立场分布变化即心态迁移。</p>

  <section id="tab-compare" class="panel hidden">
    <div class="controls">
      <label>议题
        <select id="cmp-topic">
          <option value="kids_learn">孩子学什么 / 编程</option>
          <option value="anxiety">AI 焦虑</option>
        </select>
      </label>
      <label>平台
        <select id="cmp-region">
          <option value="">全部</option>
          <option value="HN">Hacker News</option>
          <option value="X-EN">X / 英文</option>
          <option value="X-CN">X / 中文</option>
        </select>
      </label>
    </div>
    <div>
      <h3 style="margin:0 0 8px;font-size:14px;color:#b4bbe4">立场占比(%)</h3>
      <div class="chart-wrap"><canvas id="cmp-en"></canvas></div>
    </div>
    <p class="hint">按月统计：同一议题下各立场的百分比占比。</p>
  </section>

  <section id="tab-quotes" class="panel hidden">
    <div class="controls">
      <label>议题
        <select id="q-topic">
          <option value="anxiety">AI 焦虑</option>
          <option value="kids_learn">孩子学什么</option>
        </select>
      </label>
      <label>平台
        <select id="q-region">
          <option value="">全部</option>
          <option value="HN">Hacker News</option>
          <option value="X-EN">X / 英文</option>
          <option value="X-CN">X / 中文</option>
        </select>
      </label>
    </div>
    <div id="quotes-list" class="quotes"></div>
  </section>

  <section id="tab-review" class="panel hidden">
    <div class="controls">
      <label>队列
        <select id="r-filter">
          <option value="0">仅未审核</option>
          <option value="1">已审核</option>
          <option value="">全部</option>
        </select>
      </label>
      <span id="r-stats" class="stats"></span>
    </div>
    <div id="review-list" class="review"></div>
    <p class="hint">离线版的“保存”仅在当前页面内生效，不会写回数据库。</p>
  </section>

  <footer>
    <small>
      数据来自 Hacker News（公开可访问内容）与用户提供的 X 观点样本；离线版内置抓取/整理结果用于演示。
    </small>
  </footer>

  <script>
const META = {
  stance_labels: {
    anxiety: { anxious: "焦虑/担忧", optimistic: "乐观", balanced: "中立/理性", dismissive: "不以为然" },
    kids_learn: {
      still_code: "仍应学编程",
      ai_literacy: "应学 AI 素养",
      humanities_critical: "人文/批判思维优先",
      fundamentals_math: "数学/底层学科优先",
      no_code_needed: "不必学编程",
    },
  },
  author_labels: { kol: "意见领袖 KOL", tech: "科技从业者", parent: "家长", general: "普通用户" },
};

const STANCE_COLORS = {
  anxious: "#ff6b6b", optimistic: "#4ecb71", balanced: "#5c7cff", dismissive: "#9a8cff",
  still_code: "#4ecb71", ai_literacy: "#5c7cff",
  humanities_critical: "#ffbc5c", fundamentals_math: "#4ecbe8",
  no_code_needed: "#ff6b6b",
};

let POSTS = [
  { id: 1, source: "reddit", region: "EN", author_type: "parent", topic: "anxiety", stance: "anxious", posted_at: "2025-09-12", original_text: "I genuinely don't know what jobs will exist when my 8yo grows up. Every week another profession looks disrupted. I'm losing sleep over this.", translation: "我真的不知道我 8 岁孩子长大后还有什么工作。每周都有新职业被颠覆，为此我睡不好觉。", url: "https://reddit.com/r/Parenting/example_ai_anxiety_1", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"anxious\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 2, source: "mumsnet", region: "EN", author_type: "parent", topic: "anxiety", stance: "anxious", posted_at: "2025-10-03", original_text: "AITA for feeling hopeless about my kids' future careers? Teachers keep saying 'they'll be fine' but have they seen GPT-5 lately?", translation: "我对孩子未来职业感到绝望是不是过度了？老师都说「他们没事的」，但他们看过最新的 GPT-5 吗？", url: "https://mumsnet.com/Talk/example_ai_anxiety_2", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"anxious\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 3, source: "reddit", region: "EN", author_type: "tech", topic: "anxiety", stance: "balanced", posted_at: "2025-10-18", original_text: "Worked in ML for 12 years. The hype cycle is real but so is the disruption. Long-term I'm cautiously optimistic, short-term it's going to be messy for mid-skill jobs.", translation: "做 ML 12 年了。炒作是真的，冲击也是真的。长期我谨慎乐观，短期中等技能岗位会很痛。", url: "https://reddit.com/r/MachineLearning/example_ai_anxiety_3", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"balanced\",\"author_type\":\"tech\",\"region\":\"EN\"}" },
  { id: 4, source: "reddit", region: "EN", author_type: "kol", topic: "anxiety", stance: "optimistic", posted_at: "2025-11-02", original_text: "Every tech revolution caused panic. Web, mobile, cloud. AI is bigger but humans will adapt like we always did. Stop doomposting.", translation: "每次技术革命都引发恐慌。Web、移动、云端。AI 更大，但人类像以往一样会适应。别再唱衰。", url: "https://x.com/example_kol_ai_anxiety_4", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"optimistic\",\"author_type\":\"kol\",\"region\":\"EN\"}" },
  { id: 5, source: "mumsnet", region: "EN", author_type: "parent", topic: "anxiety", stance: "anxious", posted_at: "2025-12-15", original_text: "My teenager is spiraling. Says there's no point studying anything because AI will do it. I don't know how to respond.", translation: "我十几岁的孩子开始崩溃，说学什么都没意义因为 AI 都能做。我不知道怎么回应。", url: "https://mumsnet.com/Talk/example_teen_anxiety", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"anxious\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 6, source: "reddit", region: "EN", author_type: "general", topic: "anxiety", stance: "dismissive", posted_at: "2026-01-22", original_text: "It's all marketing. These 'agents' still can't book a flight without hallucinating. Calm down.", translation: "全是营销。这些「智能体」订个机票都会乱编。冷静一下。", url: "https://reddit.com/r/artificial/example_dismissive", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"dismissive\",\"author_type\":\"general\",\"region\":\"EN\"}" },
  { id: 7, source: "reddit", region: "EN", author_type: "tech", topic: "anxiety", stance: "balanced", posted_at: "2026-02-09", original_text: "Anxiety is rational, paralysis isn't. Use AI, understand its limits, re-skill where needed. Anxiety without action is just stress.", translation: "焦虑是理性的，瘫痪不是。用 AI、理解它的边界、必要时再培训。焦虑不行动只是压力。", url: "https://reddit.com/r/cscareerquestions/example_balanced", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"balanced\",\"author_type\":\"tech\",\"region\":\"EN\"}" },
  { id: 8, source: "reddit", region: "EN", author_type: "parent", topic: "anxiety", stance: "optimistic", posted_at: "2026-03-11", original_text: "Honestly I've become less anxious over time. My kid uses AI to learn faster than I ever could. We just need to teach judgement.", translation: "说实话我越来越不焦虑了。孩子用 AI 学得比我以前快得多。我们只需要教他判断力。", url: "https://reddit.com/r/Parenting/example_optimistic", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"optimistic\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 9, source: "zhihu", region: "CN", author_type: "parent", topic: "anxiety", stance: "balanced", posted_at: "2025-10-20", original_text: "说不焦虑是假的，但焦虑没用。身边同事孩子都在卷 AI 夏令营，我们家暂时先练阅读和表达。", translation: "It's a lie to say I'm not anxious, but anxiety is useless. My colleagues' kids are all in AI summer camps; we focus on reading and communication for now.", url: "https://zhihu.com/question/example_cn_anxiety_1", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"balanced\",\"author_type\":\"parent\",\"region\":\"CN\"}" },
  { id: 10, source: "xiaohongshu", region: "CN", author_type: "parent", topic: "anxiety", stance: "anxious", posted_at: "2025-11-15", original_text: "看了扎克伯格说要裁掉中级工程师，我连夜把孩子的 Python 课退了，又报了新的 AI 产品经理课。谁能告诉我该学什么？😭", translation: "After seeing Zuckerberg say they'll lay off mid-level engineers, I cancelled my kid's Python course overnight and signed up for an AI PM course instead. Can anyone tell me what to learn?", url: "https://xiaohongshu.com/discovery/example_cn_anxiety_2", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"anxious\",\"author_type\":\"parent\",\"region\":\"CN\"}" },
  { id: 11, source: "weibo", region: "CN", author_type: "kol", topic: "anxiety", stance: "optimistic", posted_at: "2025-12-08", original_text: "每次技术革命都会有一波焦虑，然后一波新机会。家长与其焦虑，不如和孩子一起学 AI 工具，这是我家的做法。", translation: "Every tech revolution comes with anxiety then new opportunities. Instead of being anxious, learn AI tools together with your kids — that's what we do.", url: "https://weibo.com/example_cn_kol_anxiety", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"optimistic\",\"author_type\":\"kol\",\"region\":\"CN\"}" },
  { id: 12, source: "bilibili", region: "CN", author_type: "general", topic: "anxiety", stance: "anxious", posted_at: "2026-01-18", original_text: "刚毕业找不到工作，看着 AI 一个比一个强，每天都在怀疑读这么多年书的意义。", translation: "Just graduated can't find a job, AI getting stronger every day, questioning the meaning of all those years of schooling.", url: "https://bilibili.com/video/example_cn_grad_anxiety", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"anxious\",\"author_type\":\"general\",\"region\":\"CN\"}" },
  { id: 13, source: "wechat", region: "CN", author_type: "kol", topic: "anxiety", stance: "balanced", posted_at: "2026-02-20", original_text: "与其问「AI会不会替代人」，不如问「哪些场景仍然需要人的判断和责任」。焦虑的背面是行动。", translation: "Instead of asking 'will AI replace people', ask 'which scenarios still need human judgment and accountability'. The flip side of anxiety is action.", url: "https://mp.weixin.qq.com/s/example_cn_balanced", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"balanced\",\"author_type\":\"kol\",\"region\":\"CN\"}" },
  { id: 14, source: "douyin", region: "CN", author_type: "parent", topic: "anxiety", stance: "anxious", posted_at: "2026-03-05", original_text: "连小学老师都在用 AI 批作业了，我们家孩子以后拿什么竞争？真的想躺平。", translation: "Even elementary teachers grade with AI now. What will my kid compete with later? I really want to give up.", url: "https://douyin.com/video/example_cn_anxiety_3", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"anxious\",\"author_type\":\"parent\",\"region\":\"CN\"}" },
  { id: 15, source: "zhihu", region: "CN", author_type: "tech", topic: "anxiety", stance: "balanced", posted_at: "2026-03-28", original_text: "作为算法工程师，真心建议家长别短线焦虑。让孩子会提问、会判断、会协作，比现在学什么具体技术重要得多。", translation: "As an ML engineer, I honestly advise parents not to be short-term anxious. Teaching kids to ask, judge, and collaborate matters far more than any specific tech.", url: "https://zhihu.com/answer/example_cn_tech_balanced", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"anxiety\",\"stance\":\"balanced\",\"author_type\":\"tech\",\"region\":\"CN\"}" },
  { id: 16, source: "reddit", region: "EN", author_type: "tech", topic: "kids_learn", stance: "still_code", posted_at: "2025-09-20", original_text: "Coding teaches decomposition and debugging. Those skills are MORE valuable when AI writes the code, not less. Kids should still learn to code.", translation: "编程教会分解问题和 debug。当 AI 写代码时，这些技能更有价值，而不是更没价值。孩子还是要学编程。", url: "https://reddit.com/r/learnprogramming/example_en_still_code", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"still_code\",\"author_type\":\"tech\",\"region\":\"EN\"}" },
  { id: 17, source: "reddit", region: "EN", author_type: "kol", topic: "kids_learn", stance: "ai_literacy", posted_at: "2025-10-11", original_text: "Hot take: syntax-level coding classes for 10yos are obsolete. Teach prompting, verification, and AI ethics instead.", translation: "观点：给 10 岁孩子教语法级编程已经过时了。应该教 prompt、验证和 AI 伦理。", url: "https://x.com/example_en_kol_literacy", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"ai_literacy\",\"author_type\":\"kol\",\"region\":\"EN\"}" },
  { id: 18, source: "mumsnet", region: "EN", author_type: "parent", topic: "kids_learn", stance: "humanities_critical", posted_at: "2025-11-05", original_text: "We pivoted our daughter from Scratch to debate club. Critical thinking & writing will outlast any language or framework.", translation: "我们让女儿从 Scratch 转到辩论社。批判性思维和写作能比任何语言框架活得都久。", url: "https://mumsnet.com/Talk/example_en_humanities", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"humanities_critical\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 19, source: "reddit", region: "EN", author_type: "parent", topic: "kids_learn", stance: "fundamentals_math", posted_at: "2025-12-02", original_text: "Math and stats are the real moat. If kids understand probability and linear algebra, AI is a tool; if not, AI is a black box.", translation: "数学和统计才是真正的护城河。孩子懂概率和线代，AI 就是工具；不懂，AI 就是黑盒子。", url: "https://reddit.com/r/education/example_en_math", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"fundamentals_math\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 20, source: "reddit", region: "EN", author_type: "tech", topic: "kids_learn", stance: "ai_literacy", posted_at: "2026-01-08", original_text: "I work at a FAANG. We hire for taste and problem framing now. Kids should build stuff with AI, not memorize syntax.", translation: "我在 FAANG。我们现在招人看审美和问题拆解。孩子应该用 AI 做东西，而不是背语法。", url: "https://reddit.com/r/cscareerquestions/example_en_literacy_2", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"ai_literacy\",\"author_type\":\"tech\",\"region\":\"EN\"}" },
  { id: 21, source: "mumsnet", region: "EN", author_type: "parent", topic: "kids_learn", stance: "still_code", posted_at: "2026-02-14", original_text: "My 14yo built a Discord bot with Copilot last weekend. He learned MORE about coding than his whole term at school. Coding isn't dead — it's democratized.", translation: "我 14 岁的娃用 Copilot 周末就写了个 Discord 机器人，比学校一学期学的还多。编程没死，而是被民主化了。", url: "https://mumsnet.com/Talk/example_en_still_code_2", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"still_code\",\"author_type\":\"parent\",\"region\":\"EN\"}" },
  { id: 22, source: "reddit", region: "EN", author_type: "general", topic: "kids_learn", stance: "no_code_needed", posted_at: "2026-03-01", original_text: "Why would anyone teach a kid to code when they can just describe what they want? Save them the pain.", translation: "AI 都能描述即得，为什么还要教孩子写代码？别让他们受罪了。", url: "https://reddit.com/r/artificial/example_en_no_code", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"no_code_needed\",\"author_type\":\"general\",\"region\":\"EN\"}" },
  { id: 23, source: "reddit", region: "EN", author_type: "kol", topic: "kids_learn", stance: "humanities_critical", posted_at: "2026-03-22", original_text: "The scarce skill in 2030 won't be coding — it'll be asking the right questions and owning the consequences. Raise kids who can do that.", translation: "2030 年稀缺的不是编程，而是会提对问题、敢承担后果。把孩子培养成这样的人。", url: "https://x.com/example_en_kol_humanities", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"humanities_critical\",\"author_type\":\"kol\",\"region\":\"EN\"}" },
  { id: 24, source: "oecd", region: "EN", author_type: "kol", topic: "kids_learn", stance: "ai_literacy", posted_at: "2026-02-01", original_text: "Future-ready curricula should combine computational thinking with AI literacy and socio-emotional skills.", translation: "面向未来的课程应结合计算思维、AI 素养和社会情感能力。", url: "https://oecd.org/education/example_ai_literacy_report", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"ai_literacy\",\"author_type\":\"kol\",\"region\":\"EN\"}" },
  { id: 25, source: "zhihu", region: "CN", author_type: "tech", topic: "kids_learn", stance: "still_code", posted_at: "2025-10-15", original_text: "让孩子学编程不是为了写代码，是为了学分解问题。AI 时代这个能力更重要。Python 还是要学。", translation: "Teaching kids coding isn't about writing code but learning decomposition. This matters more in the AI era. Python still needs to be learned.", url: "https://zhihu.com/answer/example_cn_still_code", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"still_code\",\"author_type\":\"tech\",\"region\":\"CN\"}" },
  { id: 26, source: "xiaohongshu", region: "CN", author_type: "parent", topic: "kids_learn", stance: "still_code", posted_at: "2025-11-12", original_text: "朋友说 AI 来了编程没用，但我家坚持每周 Scratch 一小时。逻辑思维这东西别的课替代不了。", translation: "My friend said coding is useless once AI came, but we still do Scratch one hour a week. Nothing else replaces logical thinking.", url: "https://xiaohongshu.com/discovery/example_cn_still_code", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"still_code\",\"author_type\":\"parent\",\"region\":\"CN\"}" },
  { id: 27, source: "weibo", region: "CN", author_type: "kol", topic: "kids_learn", stance: "humanities_critical", posted_at: "2025-12-18", original_text: "AI 时代最稀缺的是提问能力、审美和同理心，这些都需要阅读和讨论来培养，不是刷编程题。", translation: "The scarcest skills in the AI era are asking questions, taste, and empathy — these come from reading and discussion, not coding drills.", url: "https://weibo.com/example_cn_kol_humanities", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"humanities_critical\",\"author_type\":\"kol\",\"region\":\"CN\"}" },
  { id: 28, source: "bilibili", region: "CN", author_type: "tech", topic: "kids_learn", stance: "ai_literacy", posted_at: "2026-01-05", original_text: "我在大厂带 AI 团队，我女儿的「编程课」现在是和 AI 一起做小游戏。教语法没意义，教她怎么用 AI + 验证结果才有用。", translation: "I lead an AI team at a big tech firm. My daughter's 'coding class' is now building games with AI. Teaching syntax is pointless; teaching her to use AI and verify results matters.", url: "https://bilibili.com/video/example_cn_ai_literacy", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"ai_literacy\",\"author_type\":\"tech\",\"region\":\"CN\"}" },
  { id: 29, source: "wechat", region: "CN", author_type: "kol", topic: "kids_learn", stance: "ai_literacy", posted_at: "2026-02-12", original_text: "家长问我还要不要给孩子报编程班。我的建议：把一半时间换成 AI 素养课——prompt、事实核查、伦理判断。", translation: "Parents ask if kids should still take coding classes. My advice: swap half the time for AI literacy — prompting, fact-checking, ethical judgment.", url: "https://mp.weixin.qq.com/s/example_cn_kol_literacy", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"ai_literacy\",\"author_type\":\"kol\",\"region\":\"CN\"}" },
  { id: 30, source: "zhihu", region: "CN", author_type: "parent", topic: "kids_learn", stance: "fundamentals_math", posted_at: "2026-02-25", original_text: "我是理工妈，坚决认为数学物理比编程更底层。AI 工具每年换一套，数学一辈子不换。", translation: "I'm a STEM mom. Math and physics are more fundamental than coding. AI tools change yearly; math is for life.", url: "https://zhihu.com/answer/example_cn_math", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"fundamentals_math\",\"author_type\":\"parent\",\"region\":\"CN\"}" },
  { id: 31, source: "xiaohongshu", region: "CN", author_type: "parent", topic: "kids_learn", stance: "humanities_critical", posted_at: "2026-03-10", original_text: "我家今年把编程课停了，换成了阅读俱乐部和辩论。原因很简单：代码 AI 写得比孩子好，但提问和思辨它不会。", translation: "We stopped the coding class this year and switched to a book club and debate. Reason: AI writes code better than kids, but it can't ask questions or think critically.", url: "https://xiaohongshu.com/discovery/example_cn_humanities", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"humanities_critical\",\"author_type\":\"parent\",\"region\":\"CN\"}" },

  { id: 33, source: "wechat", region: "CN", author_type: "kol", topic: "kids_learn", stance: "ai_literacy", posted_at: "2026-04-02", original_text: "新一年趋势很清楚：从「学编程」转向「学与 AI 协作」。重点不是写代码，是会评估 AI 输出。", translation: "The trend this year is clear: from 'learn to code' to 'learn to collaborate with AI'. The point isn't writing code — it's evaluating AI output.", url: "https://mp.weixin.qq.com/s/example_cn_trend_2026", human_verified: 0, human_notes: "", ai_confidence: 0.8, ai_labels_json: "{\"topic\":\"kids_learn\",\"stance\":\"ai_literacy\",\"author_type\":\"kol\",\"region\":\"CN\"}" },

function monthKey(dateStr) { return String(dateStr || "").slice(0, 7); }
function stanceLabel(topic, st) { return (META.stance_labels[topic] || {})[st] || st; }
function authorLabel(a) { return META.author_labels[a] || a; }
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

const CHART_STATE = new WeakMap();
function withHiDpi(canvas, draw) {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(ctx, rect.width, rect.height);
}

function drawLegend(ctx, items, x, y) {
  const lineH = 16;
  ctx.font = "12px -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
  ctx.textBaseline = "middle";
  let cx = x;
  let cy = y;
  const maxW = ctx.canvas.getBoundingClientRect().width - x;
  items.forEach(it => {
    const textW = ctx.measureText(it.label).width;
    const w = 12 + 6 + textW + 14;
    if (cx + w > x + maxW) { cx = x; cy += lineH; }
    ctx.fillStyle = it.color;
    ctx.fillRect(cx, cy - 4, 10, 8);
    ctx.fillStyle = "#e8ebff";
    ctx.fillText(it.label, cx + 14, cy);
    cx += w;
  });
  return cy + lineH;
}

function renderLineChart(canvas, labels, datasets) {
  CHART_STATE.set(canvas, { type: "line", labels, datasets });
  withHiDpi(canvas, (ctx, W, H) => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#151937";
    ctx.fillRect(0, 0, W, H);

    const padL = 44, padR = 14, padB = 30, padT0 = 12;
    const legendH = drawLegend(ctx, datasets.map(d => ({ label: d.label, color: d.color })), 12, 14);
    const padT = Math.max(padT0, legendH);
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const maxY = Math.max(1, ...datasets.flatMap(d => d.data));

    ctx.strokeStyle = "#2a2f55";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH * i / 4);
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
    }
    ctx.stroke();

    ctx.fillStyle = "#9aa3d1";
    ctx.font = "11px -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i <= 4; i++) {
      const v = Math.round(maxY * (1 - i / 4));
      const y = padT + (plotH * i / 4);
      ctx.fillText(String(v), padL - 8, y);
    }

    const n = Math.max(1, labels.length);
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    const step = n > 1 ? plotW / (n - 1) : 0;
    const maxXTicks = Math.max(2, Math.floor(plotW / 70));
    const tickEvery = Math.max(1, Math.ceil(n / maxXTicks));
    labels.forEach((lab, i) => {
      if (i % tickEvery !== 0 && i !== n - 1) return;
      const x = padL + step * i;
      ctx.fillText(lab, x, padT + plotH + 8);
    });

    datasets.forEach(ds => {
      ctx.strokeStyle = ds.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ds.data.forEach((v, i) => {
        const x = padL + step * i;
        const y = padT + plotH * (1 - (v / maxY));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    });
  });
}

function renderStackedBarChart(canvas, labels, datasets) {
  CHART_STATE.set(canvas, { type: "stackedBar", labels, datasets });
  withHiDpi(canvas, (ctx, W, H) => {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#151937";
    ctx.fillRect(0, 0, W, H);

    const padL = 44, padR = 14, padB = 30, padT0 = 12;
    const legendH = drawLegend(ctx, datasets.map(d => ({ label: d.label, color: d.color })), 12, 14);
    const padT = Math.max(padT0, legendH);
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    ctx.strokeStyle = "#2a2f55";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= 4; i++) {
      const y = padT + (plotH * i / 4);
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
    }
    ctx.stroke();

    ctx.fillStyle = "#9aa3d1";
    ctx.font = "11px -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i <= 4; i++) {
      const v = Math.round(100 * (1 - i / 4));
      const y = padT + (plotH * i / 4);
      ctx.fillText(String(v), padL - 8, y);
    }

    const n = Math.max(1, labels.length);
    const gap = 8;
    const barW = n > 0 ? Math.max(10, (plotW - gap * (n - 1)) / n) : plotW;
    const maxXTicks = Math.max(2, Math.floor(plotW / 70));
    const tickEvery = Math.max(1, Math.ceil(n / maxXTicks));

    for (let i = 0; i < n; i++) {
      const x = padL + i * (barW + gap);
      let y0 = padT + plotH;
      datasets.forEach(ds => {
        const v = Number(ds.data[i] || 0);
        const h = plotH * (v / 100);
        ctx.fillStyle = ds.color;
        ctx.fillRect(x, y0 - h, barW, h);
        y0 -= h;
      });
      ctx.strokeStyle = "#0f1222";
      ctx.lineWidth = 1;
      ctx.strokeRect(x, padT, barW, plotH);
    }

    ctx.fillStyle = "#9aa3d1";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    labels.forEach((lab, i) => {
      if (i % tickEvery !== 0 && i !== n - 1) return;
      const x = padL + i * (barW + gap) + barW / 2;
      ctx.fillText(lab, x, padT + plotH + 8);
    });
  });
}

function applyFilters(posts, { topic, region, author_type, verified }) {
  return posts.filter(p => {
    if (topic && p.topic !== topic) return false;
    if (region && p.region !== region) return false;
    if (author_type && p.author_type !== author_type) return false;
    if (verified === "0" && p.human_verified !== 0) return false;
    if (verified === "1" && p.human_verified !== 1) return false;
    return true;
  });
}

function computeTrends({ topic, region, author_type }) {
  const rows = applyFilters(POSTS, { topic, region, author_type });
  const series = {};
  const monthSet = new Set();
  rows.forEach(r => {
    const m = monthKey(r.posted_at);
    monthSet.add(m);
    series[r.stance] = series[r.stance] || {};
    series[r.stance][m] = (series[r.stance][m] || 0) + 1;
  });
  const months = Array.from(monthSet).sort();
  const stances = Object.keys(series).sort();
  const datasets = stances.map(st => ({
    label: stanceLabel(topic, st),
    color: STANCE_COLORS[st] || "#888",
    data: months.map(m => series[st][m] || 0),
  }));
  return { months, datasets };
}

function computeCompare(topic, region) {
  const rows = applyFilters(POSTS, { topic, region });
  const monthSet = new Set();
  rows.forEach(r => monthSet.add(monthKey(r.posted_at)));
  const months = Array.from(monthSet).sort();

  const stanceOrder = Object.keys(META.stance_labels[topic] || {});
  function series() {
    const out = stanceOrder.map(st => ({ st, data: months.map(() => 0) }));
    const idxBySt = Object.fromEntries(out.map((o, i) => [o.st, i]));
    months.forEach((m, mi) => {
      const mRows = rows.filter(r => monthKey(r.posted_at) === m);
      const total = Math.max(1, mRows.length);
      const cnt = {};
      mRows.forEach(r => { cnt[r.stance] = (cnt[r.stance] || 0) + 1; });
      stanceOrder.forEach(st => {
        out[idxBySt[st]].data[mi] = Math.round((100 * (cnt[st] || 0) / total) * 10) / 10;
      });
    });
    return out.map(o => ({ label: stanceLabel(topic, o.st), color: STANCE_COLORS[o.st] || "#888", data: o.data }));
  }

  return { months, datasets: series() };
}

function renderQuote(p) {
  const el = document.createElement("div");
  el.className = "quote";
  const regionCls = String(p.region || "").toLowerCase() || "en";
  el.innerHTML = `
    <div class="meta">
      <span class="pill ${regionCls}">${escapeHtml(p.region)}</span>
      <span class="pill">${escapeHtml(p.source)}</span>
      <span class="pill">${escapeHtml(authorLabel(p.author_type))}</span>
      <span>${escapeHtml(p.posted_at)}</span>
      ${p.human_verified ? '<span class="pill" style="background:#2a5a3a;color:#b4f5c8">✓已审</span>' : ''}
      <a href="${escapeHtml(p.url)}" target="_blank" style="color:#5c7cff;margin-left:auto">source</a>
    </div>
    <p>${escapeHtml(p.original_text)}</p>
    ${p.translation ? `<p class="t">↳ ${escapeHtml(p.translation)}</p>` : ''}
  `;
  return el;
}

function loadQuotes() {
  const topic = document.getElementById("q-topic").value;
  const region = document.getElementById("q-region").value;
  const posts = applyFilters(POSTS, { topic, region });

  const groups = {};
  posts.forEach(p => { (groups[p.stance] = groups[p.stance] || []).push(p); });
  const container = document.getElementById("quotes-list");
  container.innerHTML = "";
  Object.entries(groups).forEach(([st, list]) => {
    const h = document.createElement("h3");
    h.textContent = `${stanceLabel(topic, st)} · ${list.length} 条`;
    h.style.margin = "18px 0 6px";
    h.style.color = "#b4bbe4";
    container.appendChild(h);
    list.slice(0, 4).forEach(p => container.appendChild(renderQuote(p)));
  });
}

function computeStats() {
  const total = POSTS.length;
  const verified = POSTS.filter(p => p.human_verified === 1).length;
  const unverified = total - verified;
  let overrides = 0;
  POSTS.forEach(p => {
    if (p.human_verified !== 1) return;
    if (!p.ai_labels_json) return;
    try {
      const ai = JSON.parse(p.ai_labels_json);
      if (ai && ai.stance && ai.stance !== p.stance) overrides += 1;
    } catch (_) {}
  });
  return { total, verified, unverified, stance_overrides: overrides };
}

function loadReview() {
  const verified = document.getElementById("r-filter").value;
  const posts = applyFilters(POSTS, { verified });
  const stats = computeStats();
  document.getElementById("r-stats").textContent =
    `共 ${stats.total} 条 · 已审 ${stats.verified} · 未审 ${stats.unverified} · 人工覆写 stance ${stats.stance_overrides} 次`;
  document.getElementById("review-badge").textContent = stats.unverified || "";
  const box = document.getElementById("review-list");
  box.innerHTML = "";
  posts.forEach(p => box.appendChild(renderReviewCard(p)));
}

    <div class="fields">
      <div><label>议题 (AI: ${escapeHtml(ai.topic||"?")})</label><select data-f="topic">${topicOpts}</select></div>
      <div><label>立场 (AI: ${escapeHtml(ai.stance||"?")})</label><select data-f="stance">${stanceOpts}</select></div>
      <div><label>用户分层 (AI: ${escapeHtml(ai.author_type||"?")})</label><select data-f="author_type">${authorOpts}</select></div>
      <div><label>地区 (AI: ${escapeHtml(ai.region||"?")})</label><select data-f="region">${regionOpts}</select></div>
    </div>
    <label style="font-size:11px;color:#7a83b4">审核备注</label>
    <textarea data-f="human_notes" rows="2">${escapeHtml(p.human_notes||"")}</textarea>
    <div class="row-act" style="margin-top:8px">
      <button data-act="save">保存并标记已审核</button>
      <span class="changed"></span>
    </div>
  `;

  el.querySelector('[data-f="topic"]').addEventListener("change", (e) => {
    const newTopic = e.target.value;
    const sel = el.querySelector('[data-f="stance"]');
    sel.innerHTML = Object.entries(META.stance_labels[newTopic] || {})
      .map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
  });

  el.querySelector('[data-act="save"]').addEventListener("click", () => {
    const payload = { id: p.id };
    el.querySelectorAll("[data-f]").forEach(n => payload[n.dataset.f] = n.value);
    const target = POSTS.find(x => x.id === p.id);
    if (target) {
      target.topic = payload.topic;
      target.stance = payload.stance;
      target.author_type = payload.author_type;
      target.region = payload.region;
      target.human_notes = payload.human_notes || "";
      target.human_verified = 1;
    }
    el.querySelector(".changed").textContent = "✓ 已在本页生效";
    setTimeout(() => { loadReview(); loadTrends(); loadCompare(); loadQuotes(); }, 350);
  });
  return el;
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.querySelectorAll(".panel").forEach(p => p.classList.add("hidden"));
    document.getElementById("tab-" + tab).classList.remove("hidden");
    if (tab === "trends") loadTrends();
    if (tab === "compare") loadCompare();
    if (tab === "quotes") loadQuotes();
    if (tab === "review") loadReview();
  });
});

["trend-topic", "trend-region", "trend-author"].forEach(id =>
  document.getElementById(id).addEventListener("change", loadTrends));
["cmp-topic", "cmp-region"].forEach(id =>
  document.getElementById(id).addEventListener("change", loadCompare));
["q-topic", "q-region"].forEach(id =>
  document.getElementById(id).addEventListener("change", loadQuotes));
document.getElementById("r-filter").addEventListener("change", loadReview);

window.addEventListener("resize", () => {
  const canvases = [document.getElementById("trend-chart"), document.getElementById("cmp-en")];
  canvases.forEach(c => {
    const st = CHART_STATE.get(c);
    if (!st) return;
    if (st.type === "line") renderLineChart(c, st.labels, st.datasets);
    if (st.type === "stackedBar") renderStackedBarChart(c, st.labels, st.datasets);
  });
});

loadTrends();
const s0 = computeStats();
document.getElementById("review-badge").textContent = s0.unverified || "";
  </script>
</body>
</html>
